services:
  # שירות ברכה בעברית - מחזיר "Shalom" ונגיש בפורט 9001 במחשב
  greeter-he:
    build:
      context: ../../02-docker-basics/homework/greeter
    environment:
      GREETING: Shalom
    ports:
      - "9001:8000"

  # שירות ברכה באנגלית - מחזיר "Hello" ונגיש בפורט 9002 במחשב
  greeter-en:
    build:
      context: ../../02-docker-basics/homework/greeter
    environment:
      GREETING: Hello
    ports:
      - "9002:8000"
  # שירות ברכה בצרפתית - מחזיר "Bonjour" ונגיש בפורט 9003 במחשב
  greeter-fr:
    build:
      context: ../../02-docker-basics/homework/greeter
    environment:
      GREETING: Bonjour
    ports:
      - "9003:8000"
